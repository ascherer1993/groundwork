[package]
name = "groundwork-app"
description = "Groundwork desktop app"
version.workspace = true
edition.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name
# (https://github.com/rust-lang/cargo/issues/8519).
name = "groundwork_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
groundwork-backend.workspace = true
groundwork-core.workspace = true
groundwork-protocol.workspace = true
percent-encoding = "2"
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[lints]
workspace = true
