# Code repos used by this vault's projects. Machine-local paths live in
# machine.json, not here.
acme-platform:
  name: Acme platform
  description: Monorepo for Acme's web app and its auth Lambda.
  git:
    base_branch: main
    branch_format: "{{key}}-{{slug}}"
    worktree_name: "{{key}}-{{slug}}"
  # Ignored by git, so copied into each new worktree, or linked to the main
  # checkout's so they all share one (missing ones skipped).
  copy: [.env, config/local]
  link: [CLAUDE.local.md, .claude/settings.local.json]
  setup:
    - npm install
  docs: [CLAUDE.md]
  components:
    web:
      path: apps/web
      description: Customer-facing web app, including the login flow.
      commands:
        dev: npm run dev -w apps/web
        test: npm test -w apps/web
    auth-lambda:
      path: lambdas/auth
      description: Session and token refresh Lambda.
      commands:
        test: make test
  actions:
    - id: storybook
      label: Run Storybook
      kind: terminal
      run: npm run storybook -w apps/web
      component: acme-platform:web
acme-infra:
  name: Acme infra
  description: Terraform for Acme's AWS accounts. Tickets that change both code and infrastructure have worktrees in both.
  git:
    base_branch: main
    branch_format: "{{key}}-{{slug}}"
    worktree_name: "{{key}}-{{slug}}"
  setup:
    - terraform init
  components:
    network:
      path: network
      description: VPCs, subnets and the load balancers.
