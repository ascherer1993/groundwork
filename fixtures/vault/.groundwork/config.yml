# Vault-level Groundwork settings.
pages:
  allow_network: true

trackers:
  - id: jira-team
    key_pattern: "TEAM-\\d+"
    url: "https://example.atlassian.net/browse/{{key}}"
    note_name: "{{key}} {{title}}"
    template: Templates/Ticket.md

# Shown wherever they apply (PLAN §4.7).
actions:
  - id: worktree-finder
    label: Show worktree in Finder
    kind: shell
    run: open "{{worktree.path}}"
  - id: summarise
    label: Summarise with Claude
    kind: agent                   # a Claude Code session in a tab
    input: { focus: "What should it focus on?" }
    prompt: "Summarise [[{{note.path}}]] for the {{project.name}} project, focusing on {{input.focus}}."
