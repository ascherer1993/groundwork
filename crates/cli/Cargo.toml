[package]
name = "groundwork-cli"
description = "The `groundwork` command: notes, search, templates, daily notes, todos and tickets from the terminal"
version.workspace = true
edition.workspace = true

[[bin]]
name = "groundwork"
path = "src/main.rs"

[dependencies]
groundwork-core.workspace = true
groundwork-terminal-daemon.workspace = true
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
