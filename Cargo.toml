[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
groundwork-core = { path = "crates/core" }
groundwork-protocol = { path = "crates/protocol" }
groundwork-backend = { path = "crates/backend" }
groundwork-terminal-daemon = { path = "crates/terminal-daemon" }
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
ts-rs = "12"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
